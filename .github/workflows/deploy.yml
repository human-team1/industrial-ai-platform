name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare env
        run: |
          $ErrorActionPreference = "Stop"

          $sourceEnvFile = "C:\project\industrial-ai-platform\infra\.env.prod"
          $workspaceEnvFile = "infra\.env.prod"

          if (!(Test-Path $sourceEnvFile)) {
            throw ".env file not found: $sourceEnvFile"
          }

          if (!(Test-Path "infra")) {
            New-Item -ItemType Directory -Path "infra" | Out-Null
          }

          Copy-Item $sourceEnvFile $workspaceEnvFile -Force
          Write-Host ".env.prod copied to workspace infra directory"

      - name: Deploy with Docker Compose
        run: |
          $ErrorActionPreference = "Stop"

          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod config
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
          docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod ps
