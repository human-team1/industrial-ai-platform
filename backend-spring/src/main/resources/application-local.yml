spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB106Dialect
    show-sql: false

app:
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-32-characters-long
  cors:
    allowed-origin-patterns: "http://localhost,http://localhost:5173"
    exposed-headers: "Authorization,X-Request-Id"

logging:
  level:
    '[com.example.factoryguard]': DEBUG
