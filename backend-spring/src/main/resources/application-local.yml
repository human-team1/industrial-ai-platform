spring:
  config:
    activate:
      on-profile: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB106Dialect
    show-sql: true

app:
  jwt:
    secret: local-dev-jwt-secret-key-must-be-at-least-32-characters-long

logging:
  level:
    '[com.example.factoryguard]': DEBUG
