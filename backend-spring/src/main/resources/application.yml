spring:
  application:
    name: ${APP_NAME:factory-guard-api}
  profiles:
    active: ${APP_ENV:local}
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:industrial_ai}
    username: ${DB_USER:industrial_user}
    password: ${DB_PASSWORD:change_me_user_password}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}

server:
  port: ${APP_PORT:8080}

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.example.factoryguard.domain
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8001}
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change_me_minio_password}
    bucket: ${MINIO_BUCKET:industrial-ai}
    secure: ${MINIO_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:change_me_jwt_secret}
    expire-minutes: ${JWT_EXPIRE_MINUTES:60}
  oauth2:
    google:
      client-id: ${354049085922-5dbjmlo3qbmpoalapeh0n8fnus72bc65:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
