spring:
  application:
    name: ${APP_NAME:factory-guard-api}
  profiles:
    active: ${APP_ENV:local}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:industrial_ai}
    username: ${DB_USER:industrial_user}
    password: ${DB_PASSWORD:change_me_user_password}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"

inspection:
  upload:
    max-size: 50MB
    allowed-mime-types:
      - image/jpeg
      - image/png
      - image/webp
      - video/mp4
    allowed-extensions:
      - jpg
      - jpeg
      - png
      - webp
      - mp4
  decision:
    boundary-margin: 0.05
  ai-job-worker:
    enabled: ${AI_JOB_WORKER_ENABLED:true}
    concurrency: ${AI_JOB_WORKER_CONCURRENCY:1}
    poll-interval-ms: ${AI_JOB_POLL_INTERVAL_MS:1000}
    batch-size: ${AI_JOB_BATCH_SIZE:1}
    max-retry: ${AI_JOB_MAX_RETRY:0}

app:
  session:
    max-active-users: ${MAX_ACTIVE_USERS:3}
    active-session-ttl-seconds: ${ACTIVE_SESSION_TTL_SECONDS:1800}
  document:
    upload:
      max-size-bytes: ${DOCUMENT_UPLOAD_MAX_SIZE_BYTES:52428800}
      allowed-extensions: ${DOCUMENT_UPLOAD_ALLOWED_EXTENSIONS:pdf,docx,md}
      allowed-mime-types: ${DOCUMENT_UPLOAD_ALLOWED_MIME_TYPES:application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/markdown,text/plain}
      object-prefix: ${DOCUMENT_UPLOAD_OBJECT_PREFIX:documents}
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8001}
    connect-timeout-sec: ${AI_SERVER_CONNECT_TIMEOUT_SEC:5}
    read-timeout-sec: ${AI_REQUEST_TIMEOUT_SECONDS:${AI_SERVER_READ_TIMEOUT_SEC:180}}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:180000}
    document-index:
      default-chunk-size: ${AI_DOCUMENT_INDEX_CHUNK_SIZE:800}
      default-chunk-overlap: ${AI_DOCUMENT_INDEX_CHUNK_OVERLAP:120}
      default-embedding-model: ${AI_DOCUMENT_INDEX_EMBEDDING_MODEL:default}
      polling-enabled: ${AI_DOCUMENT_INDEX_POLLING_ENABLED:true}
      poll-interval-ms: ${AI_DOCUMENT_INDEX_POLL_INTERVAL_MS:10000}
      poll-batch-size: ${AI_DOCUMENT_INDEX_POLL_BATCH_SIZE:20}
    rag:
      default-top-k: ${AI_RAG_DEFAULT_TOP_K:5}
  operation:
    monitoring:
      collect-interval-ms: ${OPERATION_MONITORING_COLLECT_INTERVAL_MS:30000}
      redis-ttl-seconds: ${OPERATION_MONITORING_REDIS_TTL_SECONDS:60}
      ai-status-timeout-sec: ${AI_SERVER_STATUS_TIMEOUT_SEC:3}
      ai-status-path: ${AI_SERVER_STATUS_PATH:/ai/v1/internal/system-status}
      instance-id: ${SPRING_INSTANCE_ID:spring-local-1}
  chroma:
    host: ${CHROMA_HOST:localhost}
    port: ${CHROMA_PORT:8000}
    collection-documents: ${CHROMA_COLLECTION_DOCUMENTS:industrial_document_chunks}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:change_me_minio_password}
    bucket-documents: ${MINIO_BUCKET_DOCUMENTS:documents}
    bucket-inspection-artifacts: ${MINIO_BUCKET_INSPECTION_ARTIFACTS:inspection-artifacts}
    bucket-reports: ${MINIO_BUCKET_REPORTS:reports}
    bucket-models: ${MINIO_BUCKET_MODELS:models}
    secure: ${MINIO_SECURE:false}
    auto-create-buckets: ${MINIO_AUTO_CREATE_BUCKETS:true}
  jwt:
    secret: ${JWT_SECRET:change_me_jwt_secret_change_me_jwt_secret}
    expire-minutes: ${JWT_EXPIRE_MINUTES:60}
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:354049085922-5dbjmlo3qbmpoalapeh0n8fnus72bc65.apps.googleusercontent.com}
      client-secret: ${GOOGLE_CLIENT_SECRET:}

factoryguard:
  model:
    memory-bank:
      min-normal-image-count: ${MODEL_MEMORY_BANK_MIN_NORMAL_IMAGE_COUNT:1}
    fixed-profiles:
      speed-object:
        ckpt-file-key: ${MODEL_SPEED_OBJECT_CKPT_KEY:models/base/speed-object/model.ckpt}
        config-file-key: ${MODEL_SPEED_OBJECT_CONFIG_KEY:models/base/speed-object/config.json}
        framework: ${MODEL_SPEED_OBJECT_FRAMEWORK:PYTORCH}
        input-size: ${MODEL_SPEED_OBJECT_INPUT_SIZE:224x224}
      speed-texture:
        ckpt-file-key: ${MODEL_SPEED_TEXTURE_CKPT_KEY:models/base/speed-texture/model.ckpt}
        config-file-key: ${MODEL_SPEED_TEXTURE_CONFIG_KEY:models/base/speed-texture/config.json}
        framework: ${MODEL_SPEED_TEXTURE_FRAMEWORK:PYTORCH}
        input-size: ${MODEL_SPEED_TEXTURE_INPUT_SIZE:224x224}
      performance-object:
        ckpt-file-key: ${MODEL_PERFORMANCE_OBJECT_CKPT_KEY:models/base/performance-object/model.ckpt}
        config-file-key: ${MODEL_PERFORMANCE_OBJECT_CONFIG_KEY:models/base/performance-object/config.json}
        framework: ${MODEL_PERFORMANCE_OBJECT_FRAMEWORK:PYTORCH}
        input-size: ${MODEL_PERFORMANCE_OBJECT_INPUT_SIZE:224x224}
      performance-texture:
        ckpt-file-key: ${MODEL_PERFORMANCE_TEXTURE_CKPT_KEY:models/base/performance-texture/model.ckpt}
        config-file-key: ${MODEL_PERFORMANCE_TEXTURE_CONFIG_KEY:models/base/performance-texture/config.json}
        framework: ${MODEL_PERFORMANCE_TEXTURE_FRAMEWORK:PYTORCH}
        input-size: ${MODEL_PERFORMANCE_TEXTURE_INPUT_SIZE:224x224}
