spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB106Dialect
    show-sql: false
  redis:
    host: localhost
    port: 6379
    timeout: 1s
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

inspection:
  upload:
    max-size: 10MB
    allowed-mime-types:
      - image/jpeg
      - image/png
    allowed-extensions:
      - jpg
      - jpeg
      - png
  decision:
    boundary-margin: 0.05

app:
  ai-server:
    base-url: http://localhost:0
    connect-timeout-sec: 1
    read-timeout-sec: 1
  chroma:
    host: localhost
    port: 8000
    collection-documents: test-collection
  minio:
    endpoint: http://localhost:0
    access-key: test
    secret-key: test-secret
    bucket-documents: documents
    bucket-inspection-artifacts: inspection-artifacts
    bucket-reports: reports
    bucket-models: models
    secure: false
    auto-create-buckets: false
  jwt:
    secret: test-jwt-secret-must-be-at-least-32-characters-long
    expire-minutes: 60
  oauth2:
    google:
      client-id: test-client-id
      client-secret: test-client-secret

logging:
  level:
    root: WARN
    "[com.example.factoryguard]": INFO
